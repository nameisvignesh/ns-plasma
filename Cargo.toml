[package]
name = "ns-plasma"
version = "0.1.0"
edition = "2024"
description = "NS Plasma — a Rust-native, provider-agnostic coding workspace"
license = "MIT"
default-run = "plasma"

[[bin]]
name = "plasma"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
eframe = "0.33"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
walkdir = "2.5"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
