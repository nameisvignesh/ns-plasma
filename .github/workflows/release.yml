name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Verify and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test --all-targets

      - name: Build release binary
        run: cargo build --release

      - name: Publish GitHub release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          script: |
            const fs = require('fs');
            const path = 'target/release/plasma';
            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.RELEASE_TAG,
              name: `NS Plasma ${process.env.RELEASE_TAG}`,
              generate_release_notes: true,
              draft: false,
              prerelease: false,
            });
            const stats = fs.statSync(path);
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              name: `plasma-linux-x86_64-${process.env.RELEASE_TAG}`,
              data: fs.createReadStream(path),
              headers: {
                'content-type': 'application/octet-stream',
                'content-length': stats.size,
              },
            });
